version: '3.8'

services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yysuni-blog
    ports:
      - "2025:2025"
    volumes:
      # 持久化数据目录
      - blog-data:/app/data
      # 如需从宿主机的 data 目录加载（开发调试用），可取消注释：
      # - ./data:/app/data
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=2025
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
    restart: unless-stopped
    # 限制资源使用
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2025/"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

volumes:
  blog-data:
    name: yysuni-blog-data
